# Its own workspace root on purpose: the parent package must never build this
# implicitly, and `cargo clippy --all-targets` at the repository root must not
# see it. It is built explicitly with --manifest-path.
[workspace]

[package]
name = "bddkit-s3"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `sync` (attohttpc + maybe-async) makes the API genuinely synchronous. NOT
# `blocking`, which wraps the async API in a tokio runtime: a cdylib is never
# unloaded and its Drop impls may never run, so a runtime living inside one has
# no owner. `dispatch` is synchronous by contract and the host already wraps it
# in spawn_blocking.
#
# default-features = false also disables `fail-on-err`, which is load-bearing:
# a 403 or a 404 must come back as a status code to inspect, not as an Err.
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync", "sync-rustls-tls"] }
serde_json = "1.0"
