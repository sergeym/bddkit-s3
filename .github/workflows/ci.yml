name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The toolchain is pinned on purpose: on a floating `stable` every new clippy
      # lint reddens PRs that have nothing to do with the change under review.
      # rustflags is emptied so only the clippy invocation below carries -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy
          rustflags: ""

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

  # Disabled, and not for the reason it looks like: `bddkit` IS published —
  # `cargo install bddkit` fetches 0.1.0 today. But no published version
  # carries the plugin ABI at all: `src/plugin/` does not exist on bddkit's
  # `main`, it lives only on the unmerged plugin branch. A host installed from
  # crates.io therefore cannot load this plugin, and the job would fail at
  # load, not at any step.
  #
  # Re-enable once a bddkit release contains the plugin ABI. Then install it
  # by a pinned version (`cargo install bddkit --version <x> --locked`) or a
  # pinned git revision (`--rev <sha>` / `--tag <tag>`) — never a floating
  # `--branch`, which would let a change in the host redden this repo's CI and
  # leave the reader unable to tell which side broke. No version, SHA or tag is
  # written here because none that satisfies the requirement exists yet.
  #
  # e2e:
  #   name: e2e against MinIO
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #
  #     - uses: actions-rust-lang/setup-rust-toolchain@v1
  #       with:
  #         toolchain: "1.97.1"
  #         rustflags: ""
  #
  #     - name: Install bddkit
  #       run: cargo install --git https://github.com/sergeym/bddkit bddkit
  #
  #     - name: Start MinIO
  #       run: docker compose up minio-init
