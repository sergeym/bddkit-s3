name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The toolchain is pinned on purpose: on a floating `stable` every new clippy
      # lint reddens PRs that have nothing to do with the change under review.
      # rustflags is emptied so only the clippy invocation below carries -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy
          rustflags: ""

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release
