name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (for example, v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: validate version and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Select tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.value }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""

      - name: Verify tag matches the plugin version
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bddkit-s3") | .version')"
          expected="v$version"
          test "$TAG" = "$expected" || {
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          }

      - name: Create the GitHub Release when needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  library:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc baseline low enough for older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Both Apple slices build on Apple Silicon; the macOS SDK supports it.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
          rustflags: ""

      - name: Build the plugin library
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix library
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="bddkit-s3-${TAG}-${TARGET}"
          case "$RUNNER_OS" in
            Linux) library="libbddkit_s3.so" ;;
            macOS) library="libbddkit_s3.dylib" ;;
            *) echo "unsupported Unix runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$library" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package Windows library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bddkit-s3-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/bddkit_s3.dll" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
