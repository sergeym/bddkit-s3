services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bddkit
      MINIO_ROOT_PASSWORD: bddkit-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The plugin has no step that creates a bucket — a bucket belongs to a config
  # entry — so the suite's bucket is created here, once, before the tests run.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bddkit bddkit-secret &&
      mc mb --ignore-existing local/apibdd-it &&
      echo bucket ready
      "
